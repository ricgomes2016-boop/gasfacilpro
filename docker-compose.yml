services:
  evolution-db:
    image: postgres:15-alpine
    container_name: evolution_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
      POSTGRES_USER: ${POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    restart: always

  evolution-redis:
    image: redis:alpine
    container_name: evolution_redis
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data
    restart: always

  evolution-api:
    image: atendimentos/evolution-api:latest
    container_name: evolution_api
    command: ["node", "dist/src/main.js"]
    environment:
      - SERVER_PORT=8000
      - SERVER_URL=${SERVER_URL:-http://localhost:8000}
      - DOCKER_RESTART_POLICY=always
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?EVOLUTION_API_KEY env var is required}
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-evolution}:${POSTGRES_PASSWORD}@evolution-db:5432/${POSTGRES_DB:-evolution}?sslmode=disable
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
    ports:
      - "8000:8000"
    depends_on:
      - evolution-db
      - evolution-redis
    restart: always

volumes:
  evolution_db_data:
  evolution_redis_data:
