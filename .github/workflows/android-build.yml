name: Construir APK (App do Entregador)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite rodar o build manualmente se quiser

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Setup Java (Android SDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Verificar Ambiente Java
      run: |
        java -version
        echo $JAVA_HOME

    - name: Instalar Dependências
      run: npm ci

    - name: Corrigir AGP Antigo no Plugin Background GPS
      run: sed -i "s/gradle:8.0.0/gradle:8.13.0/g" node_modules/@capacitor-community/background-geolocation/android/build.gradle

    - name: Fazer Build do Painel Web (Vite)
      run: npm run build

    - name: Sincronizar com Android (Capacitor)
      run: npx cap sync android

    - name: Compilar o APK (Gradle)
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME

    - name: Disponibilizar o APK para Download (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: GasFacilPro_Entregador.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Gerar tag com data/hora
      id: tag
      run: echo "tag=apk-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Renomear APK
      run: cp android/app/build/outputs/apk/debug/app-debug.apk ./GasFacilPro_Entregador.apk

    - name: Criar Release com APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: "APK Entregador - ${{ steps.tag.outputs.tag }}"
        body: "Build automático do APK do Entregador. Clique no arquivo `.apk` abaixo para baixar diretamente."
        files: GasFacilPro_Entregador.apk
        make_latest: true
