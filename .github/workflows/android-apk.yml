name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "src/**"
      - "supabase/functions/_shared/fcm.ts"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Firebase Android config from secret
        if: ${{ env.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: |
          echo "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Validate native push configuration
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL_ID="gasfacil_alerts_v3"
          SOUND_FILE="gasfacil_alert.wav"
          FCM_SOUND="gasfacil_alert"

          require_file() {
            test -f "$1" || { echo "::error::Arquivo obrigatório ausente: $1"; exit 1; }
          }

          require_text() {
            local pattern="$1"
            local file="$2"
            grep -q "$pattern" "$file" || { echo "::error::Padrão '$pattern' não encontrado em $file"; exit 1; }
          }

          require_file android/app/google-services.json
          require_file android/app/src/main/res/raw/$SOUND_FILE

          require_text '"package_name": "com.gasfacilpro.app"' android/app/google-services.json
          require_text "$CHANNEL_ID" android/app/src/main/res/values/strings.xml
          require_text 'com.google.firebase.messaging.default_notification_channel_id' android/app/src/main/AndroidManifest.xml
          require_text "$CHANNEL_ID" android/app/src/main/java/com/gasfacilpro/app/MainActivity.java
          require_text "$CHANNEL_ID" src/hooks/useNativePush.ts
          require_text "$SOUND_FILE" src/hooks/useNativePush.ts
          require_text "$CHANNEL_ID" supabase/functions/_shared/fcm.ts
          require_text "$FCM_SOUND" supabase/functions/_shared/fcm.ts

      - name: Build debug and release APKs
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Verify APK contains Firebase config and alert sound
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          test -f "$DEBUG_APK"
          unzip -l "$DEBUG_APK" | grep -q 'res/raw/gasfacil_alert.wav'

          if [ -f "$RELEASE_APK" ]; then
            unzip -l "$RELEASE_APK" | grep -q 'res/raw/gasfacil_alert.wav'
          fi

      - name: Sign release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != '' }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ env.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ env.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ env.ANDROID_KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gasfacil-entregador-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: gasfacil-entregador-release-apks
          path: |
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
